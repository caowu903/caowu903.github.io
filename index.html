<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手淘惊喜红包 · 数据日报</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#333}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);color:#fff;padding:36px 20px 28px;text-align:center}
.header h1{font-size:30px} .header h1 span{color:#e94560}
.header .sub{margin-top:8px;font-size:14px;opacity:.8}
.container{max-width:1400px;margin:0 auto;padding:20px}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px}
.kpi-card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06);text-align:center}
.kpi-card .lbl{font-size:12px;color:#888}
.kpi-card .val{font-size:26px;font-weight:700;margin:6px 0}
.kpi-card .sub{font-size:11px;color:#aaa}

.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px}
.chart-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.chart-card.full{grid-column:1/-1}
.chart-card h3{font-size:15px;margin-bottom:14px;padding-left:10px;border-left:3px solid #e94560}
.chart-wrap{position:relative;height:280px}

.table-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow-x:auto;margin-bottom:24px}
.table-card h3{font-size:15px;margin-bottom:14px;padding-left:10px;border-left:3px solid #e94560}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid #f0f0f0}
th:first-child,td:first-child{text-align:left;font-weight:600;position:sticky;left:0;background:#fff;z-index:1}
th{background:#f8f9fb;position:sticky;top:0;z-index:2}
tr:hover td{background:#f5f7fa}
.total-row td{font-weight:700;background:#fff8e1 !important;border-top:2px solid #ffd54f}

.footer{text-align:center;padding:24px;font-size:12px;color:#999}

@media(max-width:768px){.charts-grid{grid-template-columns:1fr} .kpi-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div class="header">
  <h1>🎁 手淘<span>惊喜红包</span></h1>
  <div class="sub">数据日报 · 智能看板</div>
  <div class="sub" style="margin-top:10px;font-size:12px;opacity:.6">0521 ~ 0604</div>
</div>

<div class="container">

<div id="kpiGrid" class="kpi-grid"></div>

<div class="charts-grid">
  <div class="chart-card full"><h3>📈 核心指标趋势</h3><div class="chart-wrap"><canvas id="c1"></canvas></div></div>
  <div class="chart-card"><h3>💰 金额类指标</h3><div class="chart-wrap"><canvas id="c2"></canvas></div></div>
  <div class="chart-card"><h3>🎯 转化率 & 补贴</h3><div class="chart-wrap"><canvas id="c3"></canvas></div></div>
</div>

<div class="table-card">
  <h3>📋 详细数据表</h3>
  <table id="dt"></table>
</div>

</div>

<div class="footer">
  数据来源: ODPS tvtaobao_dev · QwenPaw 自动生成 · <a href="https://github.com/caowu903/caowu903.github.io" style="color:#666" target="_blank">GitHub</a>
</div>

<script>
// 数据
const dates = ["0521", "0522", "0523", "0524", "0525", "0526", "0527", "0528", "0529", "0530", "0531", "0601", "0602", "0603", "0604"];
const rawData = {"\u66dd\u5149UV": [124760, 81751, 99252, 95625, 131553, 127369, 142453, 86086, 109535, 82086, 95305, 115375, 81858, 93919, 125492], "\u66dd\u5149PV": [363482, 266132, 376780, 442829, 201950, 441746, 409442, 302075, 246644, 487164, 300978, 227824, 229015, 454248, 381118], "\u70b9\u51fbUV": [58249, 55541, 48768, 64059, 43249, 49321, 59029, 51648, 60160, 50207, 54660, 31604, 37976, 40129, 32793], "\u70b9\u51fbPV": [76295, 67070, 79458, 104498, 85538, 85913, 74665, 78688, 125566, 105362, 102639, 71980, 111039, 71438, 86562], "\u70b9\u51fb\u7387": [44.82, 38.88, 37.47, 39.64, 42.33, 41.19, 31.89, 28.55, 33.36, 32.55, 31.59, 44.03, 42.9, 33.35, 39.14], "\u53d1\u653e\u4e2a\u6570": [67803, 91155, 70648, 61920, 61098, 75262, 61823, 76306, 90402, 67973, 59869, 94889, 72929, 54091, 52120], "\u53d1\u653e\u4eba\u6570": [43838, 61961, 67723, 54776, 42223, 53357, 74864, 58519, 73988, 70127, 40402, 65225, 63860, 58794, 49339], "\u53d1\u653e\u91d1\u989d": [524337, 339043, 452168, 458803, 633836, 606549, 392186, 475205, 362528, 619420, 604681, 404456, 523632, 513140, 353494], "\u6838\u9500\u7b14\u6570": [51350, 45103, 51802, 44850, 30016, 39076, 30545, 56015, 54604, 53287, 38610, 31622, 54584, 56515, 32398], "\u6838\u9500\u4eba\u6570": [36178, 26592, 42494, 42614, 27953, 35931, 37645, 31096, 45066, 34732, 29871, 37404, 41788, 29626, 32169], "\u6838\u9500\u91d1\u989d": [418933, 342973, 296382, 313867, 226621, 249433, 274379, 329428, 250625, 248448, 215618, 338843, 250367, 399192, 389120], "\u652f\u4ed8\u91d1\u989d": [899200, 1133206, 1736569, 1099932, 985237, 2109720, 1599460, 1461739, 1898467, 1930496, 1066574, 935703, 1403472, 1393010, 1453835], "\u8865\u8d34\u6bd4\u4f8b": [28.21, 27.43, 31.78, 19.38, 23.64, 22.75, 30.06, 21.48, 20.66, 24.28, 23.91, 21.9, 21.5, 30.93, 24.2], "KA\u6838\u9500\u91d1\u989d": [200589, 157046, 87082, 219900, 197044, 215659, 209691, 198817, 103284, 147990, 109925, 136146, 88209, 133056, 217943]};
const totalRow = {"\u66dd\u5149UV": 1592419, "\u66dd\u5149PV": 5131427, "\u70b9\u51fbUV": 737393, "\u70b9\u51fbPV": 1326711, "\u70b9\u51fb\u7387": 561.6899999999999, "\u53d1\u653e\u4e2a\u6570": 1058288, "\u53d1\u653e\u4eba\u6570": 878996, "\u53d1\u653e\u91d1\u989d": 7263478, "\u6838\u9500\u7b14\u6570": 670377, "\u6838\u9500\u4eba\u6570": 531159, "\u6838\u9500\u91d1\u989d": 4544229, "\u652f\u4ed8\u91d1\u989d": 21106620, "\u8865\u8d34\u6bd4\u4f8b": 372.10999999999996, "KA\u6838\u9500\u91d1\u989d": 2422381};

// 指标配置
const metrics = [
  ['曝光UV','#5470C6','👁️'],
  ['点击UV','#FAC858','🖱️'],
  ['发放金额','#FC8452','💰'],
  ['核销金额','#9A60B4','✅'],
  ['支付金额','#EA7CCC','💳'],
  ['点击率','#73C0DE','📊'],
];

const grid = document.getElementById('kpiGrid');
metrics.forEach(([label, color, icon]) => {
  if(!rawData[label]) return;
  const vals = rawData[label];
  const last = vals[vals.length-1];
  const prev = vals.length>1?vals[vals.length-2]:0;
  const chg = prev>0?((last-prev)/prev*100).toFixed(1):0;
  const isPct = label.includes('率');
  const fmt = v => isPct ? v+'%' : (v>=10000?v.toLocaleString():v);
  const card = document.createElement('div');
  card.className='kpi-card';
  card.innerHTML=`<div style="font-size:22px">${icon}</div><div class="lbl">${label}</div><div class="val" style="color:${color}">${fmt(last)}</div><div class="sub">${chg>=0?'📈':'📉'}较上日 ${chg>=0?'+':''}${chg}%</div>`;
  grid.appendChild(card);
});

function ds(label, dataArr, color, opts) {
  return Object.assign({
    label, data: dataArr,
    borderColor: color,
    backgroundColor: color+'30',
    borderWidth: 2,
    pointRadius: 3,
    tension: 0.3,
    fill: false
  }, opts||{});
}

const opts = {
  responsive: true, maintainAspectRatio: false,
  interaction: {mode:'index', intersect:false},
  plugins: {legend: {position:'bottom', labels:{padding:14, usePointStyle:true}}},
  scales: {x:{grid:{display:false}, ticks:{maxTicksLimit:14}}, y:{beginAtZero:true, grid:{color:'#eee'}}}
};

new Chart(document.getElementById('c1'), {
  type:'line',
  data:{labels:dates, datasets:[
    ds('曝光UV', rawData['曝光UV'], '#5470C6'),
    ds('点击UV', rawData['点击UV'], '#FAC858'),
    ds('发放个数', rawData['发放个数'], '#3BA272'),
    ds('核销笔数', rawData['核销笔数'], '#9A60B4')
  ]},
  options:opts
});

new Chart(document.getElementById('c2'), {
  type:'bar',
  data:{labels:dates, datasets:[
    ds('发放金额', rawData['发放金额'], '#FC8452'),
    ds('核销金额', rawData['核销金额'], '#9A60B4'),
    ds('支付金额', rawData['支付金额'], '#EA7CCC')
  ]},
  options:opts
});

new Chart(document.getElementById('c3'), {
  type:'line',
  data:{labels:dates, datasets:[
    ds('点击率%', rawData['点击率'], '#73C0DE'),
    ds('补贴比例%', rawData['补贴比例'], '#FFB1C1')
  ]},
  options:{...opts, scales:{...opts.scales, y:{...opts.scales.y, ticks:{callback:v=>v+'%'}}}}
});

// 表格
const tableKeys = ['曝光UV','曝光PV','点击UV','点击PV','点击率','发放个数','发放人数','发放金额','核销笔数','核销人数','核销金额','支付金额','补贴比例','KA核销金额'];
let th = '<table><thead><tr><th>指标</th>';
dates.forEach(d=>th+='<th>'+d+'</th>');
th+='</tr></thead><tbody>';
tableKeys.forEach(k=>{
  const vals = rawData[k];
  if(!vals) return;
  const isPct = k.includes('率')||k.includes('补贴');
  th+='<tr><td>'+k+'</td>';
  vals.forEach(v=>th+='<td>'+(isPct?v:(Math.round(v).toLocaleString()))+'</td>');
  th+='</tr>';
});
th+='<tr class="total-row"><td>周期累计</td>';
tableKeys.forEach(k=>{
  const vals = rawData[k];
  if(!vals) return;
  const s = vals.reduce((a,b)=>a+b,0);
  const isPct = k.includes('率')||k.includes('补贴');
  th+='<td>'+(isPct?(s/vals.length).toFixed(2):Math.round(s).toLocaleString())+'</td>';
});
th+='</tr></tbody></table>';
document.getElementById('dt').innerHTML=th;
</script>
</body>
</html>
