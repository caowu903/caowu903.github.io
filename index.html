<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手淘惊喜红包 · 数据日报</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #f0f2f5;
  color: #2c3e50;
  min-height: 100vh;
}

/* ===== Header ===== */
.header {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  color: white;
  padding: 40px 20px 30px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 30px 30px;
  pointer-events: none;
}
.header h1 { font-size: 32px; font-weight: 700; letter-spacing: 2px; position: relative; }
.header h1 span { color: #e94560; }
.header .subtitle {
  margin-top: 10px;
  font-size: 14px;
  opacity: 0.8;
  position: relative;
}
.header .date-badge {
  display: inline-block;
  margin-top: 12px;
  padding: 4px 20px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 20px;
  font-size: 13px;
  position: relative;
}

/* ===== Container ===== */
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }

/* ===== KPI Cards ===== */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.kpi-card {
  background: white;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  text-align: center;
  transition: transform 0.2s, box-shadow 0.2s;
  cursor: default;
}
.kpi-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
}
.kpi-card .kpi-icon {
  font-size: 24px;
  margin-bottom: 8px;
}
.kpi-card .kpi-label {
  font-size: 13px;
  color: #888;
  margin-bottom: 6px;
}
.kpi-card .kpi-value {
  font-size: 26px;
  font-weight: 700;
}
.kpi-card .kpi-sub {
  font-size: 12px;
  color: #999;
  margin-top: 4px;
}

/* ===== Charts ===== */
.charts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 24px;
}
.chart-card {
  background: white;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.chart-card.full { grid-column: 1 / -1; }
.chart-card h3 {
  font-size: 16px;
  margin-bottom: 16px;
  padding-left: 12px;
  border-left: 3px solid #e94560;
}
.chart-card h3 .desc {
  font-size: 12px;
  color: #999;
  font-weight: 400;
  margin-left: 8px;
}
.chart-wrap { position: relative; height: 300px; }

/* ===== Table ===== */
.table-card {
  background: white;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  overflow-x: auto;
  margin-bottom: 24px;
}
.table-card h3 {
  font-size: 16px;
  margin-bottom: 16px;
  padding-left: 12px;
  border-left: 3px solid #e94560;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  white-space: nowrap;
}
th, td {
  padding: 10px 14px;
  text-align: right;
  border-bottom: 1px solid #f0f0f0;
}
th:first-child, td:first-child {
  text-align: left;
  font-weight: 600;
  position: sticky;
  left: 0;
  background: white;
  z-index: 1;
}
th {
  background: #f8f9fb;
  font-weight: 600;
  color: #555;
  position: sticky;
  top: 0;
  z-index: 2;
}
tr:hover td { background: #f5f7fa; }
.total-row td {
  font-weight: 700;
  background: #fff8e1 !important;
  border-top: 2px solid #ffd54f;
}

/* ===== Status ===== */
.status-bar {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.status-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 12px;
}
.status-tag.live { background: #e8f5e9; color: #2e7d32; }
.status-tag.pending { background: #fff3e0; color: #e65100; }

/* ===== Footer ===== */
.footer {
  text-align: center;
  padding: 30px;
  font-size: 12px;
  color: #999;
}

/* ===== Responsive ===== */
@media (max-width: 900px) {
  .charts-grid { grid-template-columns: 1fr; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 480px) {
  .kpi-grid { grid-template-columns: 1fr; }
  .header h1 { font-size: 22px; }
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>🎁 手淘<span>惊喜红包</span></h1>
  <div class="subtitle">数据日报 · 实时看板</div>
  <div class="date-badge" id="dateBadge">数据加载中...</div>
</div>

<div class="container">

  <!-- Status -->
  <div class="status-bar">
    <span class="status-tag pending" id="dataStatus">⏳ 数据待接入</span>
    <span class="status-tag live">✅ GitHub Pages 已启用</span>
    <span class="status-tag pending">🔄 自动更新: 每日 13:30</span>
  </div>

  <!-- KPI Cards -->
  <div class="kpi-grid" id="kpiGrid"></div>

  <!-- Charts -->
  <div class="charts-grid">
    <div class="chart-card full">
      <h3>📈 核心指标趋势 <span class="desc">曝光 / 点击 / 发放</span></h3>
      <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>💰 金额类指标 <span class="desc">发放 vs 核销 vs 支付</span></h3>
      <div class="chart-wrap"><canvas id="amountChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>🎯 转化率 & 补贴 <span class="desc">UV点击率 / 补贴比例</span></h3>
      <div class="chart-wrap"><canvas id="rateChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>📊 KA 核销趋势 <span class="desc">KA 核销金额</span></h3>
      <div class="chart-wrap"><canvas id="kaChart"></canvas></div>
    </div>
  </div>

  <!-- Data Table -->
  <div class="table-card">
    <h3>📋 详细数据表 <span class="desc">字段为行 · 日期为列</span></h3>
    <table id="dataTable"></table>
  </div>

</div>

<div class="footer">
  数据来源: ODPS tvtaobao_dev · 由 QwenPaw 自动生成 · 
  <a href="https://github.com/caowu903/caowu903.github.io" target="_blank" style="color:#666;">GitHub</a>
</div>

<script>
// ===== 模拟示例数据（待接入真实 ODPS 数据）=====
const dates = [];
const startDate = new Date(2026, 4, 21); // 2026-05-21
const endDate = new Date(2026, 5, 4);    // 2026-06-04
for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  dates.push(m + day);
}

// 模拟数据生成
function randRange(min, max) {
  return Math.round(min + Math.random() * (max - min));
}
function randFloat(min, max, fixed) {
  return parseFloat((min + Math.random() * (max - min)).toFixed(fixed));
}

const mockData = {
  '惊喜红包曝光 uv': dates.map(() => randRange(80000, 150000)),
  '惊喜红包曝光 pv': dates.map(() => randRange(200000, 500000)),
  '惊喜红包点击 uv': dates.map(() => randRange(30000, 60000)),
  '惊喜红包点击 pv': dates.map(() => randRange(60000, 120000)),
  '惊喜红包 uv 点击率': dates.map(() => randFloat(28, 45, 2)),
  '红包发放个数': dates.map(() => randRange(50000, 90000)),
  '红包发放人数': dates.map(() => randRange(40000, 70000)),
  '红包发放金额': dates.map(() => randRange(300000, 600000)),
  '红包核销笔数': dates.map(() => randRange(30000, 55000)),
  '红包核销人数': dates.map(() => randRange(25000, 45000)),
  '红包核销金额': dates.map(() => randRange(200000, 400000)),
  '支付金额': dates.map(() => randRange(800000, 2000000)),
  '补贴比例': dates.map(() => randFloat(18, 30, 2)),
  '红包核销金额_KA': dates.map(() => randRange(80000, 200000)),
};

// 周期累计
const summary = {};
for (const [k, v] of Object.entries(mockData)) {
  summary[k] = Array.isArray(v) 
    ? v.reduce((a, b) => a + b, 0)
    : v;
}

// 日期范围显示
const dateStr = `${dates[0]} ~ ${dates[dates.length-1]}`;
document.getElementById('dateBadge').textContent = dateStr;

// ===== KPI 卡片 =====
const kpiConfig = [
  { label: '曝光 UV', key: '惊喜红包曝光 uv', icon: '👁️', color: '#5470C6', format: v => v.toLocaleString() },
  { label: '点击 UV', key: '惊喜红包点击 uv', icon: '🖱️', color: '#FAC858', format: v => v.toLocaleString() },
  { label: '发放金额(元)', key: '红包发放金额', icon: '💰', color: '#FC8452', format: v => '¥' + v.toLocaleString() },
  { label: '核销金额(元)', key: '红包核销金额', icon: '✅', color: '#9A60B4', format: v => '¥' + v.toLocaleString() },
  { label: '支付金额(元)', key: '支付金额', icon: '💳', color: '#EA7CCC', format: v => '¥' + v.toLocaleString() },
  { label: 'UV 点击率', key: '惊喜红包 uv 点击率', icon: '📊', color: '#73C0DE', format: v => v + '%' },
];

const grid = document.getElementById('kpiGrid');
kpiConfig.forEach(cfg => {
  const values = mockData[cfg.key];
  const lastVal = values[values.length - 1];
  const prevVal = values.length > 1 ? values[values.length - 2] : 0;
  const change = prevVal > 0 ? ((lastVal - prevVal) / prevVal * 100).toFixed(1) : 0;
  const isUp = change >= 0;
  
  const card = document.createElement('div');
  card.className = 'kpi-card';
  card.innerHTML = `
    <div class="kpi-icon">${cfg.icon}</div>
    <div class="kpi-label">${cfg.label}</div>
    <div class="kpi-value" style="color:${cfg.color}">${cfg.format(lastVal)}</div>
    <div class="kpi-sub">${isUp ? '📈' : '📉'} 较上日 ${isUp ? '+' : ''}${change}%</div>
  `;
  grid.appendChild(card);
});

// ===== 图表工具函数 =====
function makeDataset(label, data, color, opts = {}) {
  return {
    label, data,
    borderColor: color,
    backgroundColor: color + '20',
    borderWidth: 2,
    pointRadius: 3,
    pointHoverRadius: 6,
    fill: opts.fill || false,
    tension: 0.3,
    yAxisID: opts.yAxis || 'y',
  };
}

const chartOpts = {
  responsive: true,
  maintainAspectRatio: false,
  interaction: { mode: 'index', intersect: false },
  plugins: {
    legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true } },
  },
  scales: {
    x: { grid: { display: false }, ticks: { maxTicksLimit: 15 } },
    y: { beginAtZero: true, grid: { color: '#f0f0f0' } },
  },
};

// 1. 主趋势图
new Chart(document.getElementById('mainChart'), {
  type: 'line',
  data: {
    labels: dates,
    datasets: [
      makeDataset('曝光 UV', mockData['惊喜红包曝光 uv'], '#5470C6'),
      makeDataset('点击 UV', mockData['惊喜红包点击 uv'], '#FAC858'),
      makeDataset('发放个数', mockData['红包发放个数'], '#3BA272'),
      makeDataset('核销笔数', mockData['红包核销笔数'], '#9A60B4'),
    ]
  },
  options: chartOpts,
});

// 2. 金额类
new Chart(document.getElementById('amountChart'), {
  type: 'bar',
  data: {
    labels: dates,
    datasets: [
      makeDataset('发放金额', mockData['红包发放金额'], '#FC8452', { fill: true }),
      makeDataset('核销金额', mockData['红包核销金额'], '#9A60B4', { fill: true }),
      makeDataset('支付金额', mockData['支付金额'], '#EA7CCC', { fill: true }),
    ]
  },
  options: { ...chartOpts, plugins: { ...chartOpts.plugins, legend: { ...chartOpts.plugins.legend } } },
});

// 3. 比率
new Chart(document.getElementById('rateChart'), {
  type: 'line',
  data: {
    labels: dates,
    datasets: [
      makeDataset('UV 点击率 (%)', mockData['惊喜红包 uv 点击率'], '#73C0DE'),
      makeDataset('补贴比例 (%)', mockData['补贴比例'], '#FFB1C1'),
    ]
  },
  options: {
    ...chartOpts,
    scales: {
      ...chartOpts.scales,
      y: { ...chartOpts.scales.y, ticks: { callback: v => v + '%' } },
    }
  },
});

// 4. KA
new Chart(document.getElementById('kaChart'), {
  type: 'line',
  data: {
    labels: dates,
    datasets: [
      makeDataset('KA 核销金额', mockData['红包核销金额_KA'], '#FF6B6B'),
    ]
  },
  options: chartOpts,
});

// ===== 数据表格 =====
const tableMetrics = [
  '惊喜红包曝光 uv', '惊喜红包曝光 pv',
  '惊喜红包点击 uv', '惊喜红包点击 pv',
  '惊喜红包 uv 点击率', '红包发放个数', '红包发放人数',
  '红包发放金额', '红包核销笔数', '红包核销人数',
  '红包核销金额', '支付金额', '补贴比例',
  '红包核销金额_KA',
];

let tableHtml = '<thead><tr><th>指标</th>';
dates.forEach(d => { tableHtml += `<th>${d}</th>`; });
tableHtml += '</tr></thead><tbody>';

tableMetrics.forEach(key => {
  const values = mockData[key];
  tableHtml += '<tr>';
  tableHtml += `<td>${key}</td>`;
  values.forEach(v => {
    const isPct = key.includes('率') || key.includes('比例');
    tableHtml += `<td>${isPct ? v : v.toLocaleString()}</td>`;
  });
  tableHtml += '</tr>';
});

// 累计行
tableHtml += '<tr class="total-row"><td>周期累计</td>';
tableMetrics.forEach(key => {
  const values = mockData[key];
  const total = values.reduce((a, b) => a + b, 0);
  const isPct = key.includes('率') || key.includes('比例');
  tableHtml += `<td>${isPct ? (total / values.length).toFixed(2) : total.toLocaleString()}</td>`;
});
tableHtml += '</tr>';

tableHtml += '</tbody>';
document.getElementById('dataTable').innerHTML = tableHtml;
</script>
</body>
</html>
